version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: bizkidzuser
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: bizkidzdb
    volumes:
      - ${POSTGRES_DATA}:/var/lib/postgresql/data
    ports:
      - 5435:5432 
    networks:
      - appnet

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api
    env_file:
      - .env
    restart: "no"
    depends_on:
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PGHost: Host=postgres;Port=5432;Database=bizkidzdb;Username=bizkidzuser;Password=1234
    ports:
      - "8080:8080"
    networks:
      - appnet

volumes:
  pgdata:

networks:
  appnet: